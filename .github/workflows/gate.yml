name: gate

# Budget guard. The private-repo allowance is 2,000 minutes/month at a 10x macOS
# multiplier -- about 200 real macOS minutes, or 25-35 runs. A bare `on: push` spends
# 6-10 of them on every branch and every markdown typo.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:

# The big one: push three times while iterating and you pay for one run, not three.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      BUNDLE_ID: com.jasraajdevz.unread

    steps:
      - uses: actions/checkout@v4

      # Runs first and costs seconds. A dangling beat id should never reach a
      # 10x-billed macOS minute -- this is the same check Windows runs pre-commit.
      - name: Story validation
        run: python3 tools/validate_story.py Unread/Resources/story.json

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list devices available | grep -i iphone

      # CLAUDE.md forbids hardcoding a simulator name nobody has verified, so resolve
      # one from what this runner image actually has.
      - name: Resolve simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['name'] for r in sorted(d,reverse=True) for x in d[r] if x['name'].startswith('iPhone')))")
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      # CODE_SIGN_STYLE stays Automatic in project.yml -- gate 4 needs it for the device
      # build. It must not touch the simulator path, which requires no signing at all.
      - name: Build
        run: |
          xcodebuild \
            -project Unread.xcodeproj \
            -scheme Unread \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Test
        run: |
          xcodebuild \
            -project Unread.xcodeproj \
            -scheme Unread \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

      - name: Screenshots
        run: |
          mkdir -p shots
          SIM="${{ steps.sim.outputs.name }}"
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          echo "Installing $APP"
          xcrun simctl install booted "$APP"

          # Beat ids come from story.json so this never drifts from the content.
          BEATS=$(python3 -c "import json;print(' '.join(b['id'] for b in json.load(open('Unread/Resources/story.json'))['beats']))")
          for BEAT in $BEATS; do
            echo "Shooting $BEAT"
            xcrun simctl launch --terminate-running-process booted "$BUNDLE_ID" -uiSnapshotBeat "$BEAT"
            sleep 4
            xcrun simctl io booted screenshot "shots/$BEAT.png"
          done
          xcrun simctl shutdown "$SIM" || true
          ls -l shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: warn
