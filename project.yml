# The .xcodeproj is generated from this file and is gitignored (CLAUDE.md rule 12).
#
# Why the output opens on older Xcodes: XcodeGen never inspects your installed Xcode. It
# writes a fixed, deliberately old `compatibilityVersion` through XcodeProj, so the same
# generated project opens on Xcode 15 and 26 alike. That is version-independence BY
# CONSTRUCTION, not by detection -- nothing here adapts to a local toolchain.
#
# Do NOT add `options.xcodeVersion` to "fix" a project-format problem. Despite the name it
# only feeds LastUpgradeCheck and cannot change the emitted format.
name: Unread
options:
  bundleIdPrefix: com.jasraajdevz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Unread:
    type: application
    platform: iOS
    sources:
      - path: Unread
    info:
      path: Unread/Info.plist
      properties:
        CFBundleDisplayName: Unread
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasraajdevz.unread
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        # Needed at gate 4 (build onto a real iPhone). It must never reach the simulator
        # path, so gate.yml passes CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO.
        CODE_SIGN_STYLE: Automatic

  UnreadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Unread
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasraajdevz.unread.tests
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        # Set explicitly rather than relying on XcodeGen's implicit host wiring:
        # StoryValidationTests reads story.json out of Bundle.main, which is only
        # the app bundle when the tests are hosted.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Unread.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Unread"
        BUNDLE_LOADER: "$(TEST_HOST)"

configs:
  Debug: debug
  Release: release

settings:
  configs:
    Debug:
      ENABLE_TESTABILITY: "YES"

schemes:
  Unread:
    build:
      targets: { Unread: all }
    test:
      config: Debug
      targets: [UnreadTests]
    run:
      config: Debug
