<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#08090C; --phone:#14171C; --bar:#171B21; --line:#1C222B;
    --them:#1E232B; --me:#2E3A45;
    --ink:#D6D9DE; --dim:#8A929C; --faint:#5C6672;
    --alert:#A63D40; --instr:#B8863F;
  }
  *{box-sizing:border-box;}
  body{
    background:var(--ground); color:var(--ink); margin:0; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:16px; gap:12px;
  }
  .phone{
    width:100%; max-width:390px; height:min(780px,88vh); background:var(--phone);
    border:1px solid var(--line); border-radius:22px; overflow:hidden;
    display:flex; flex-direction:column; position:relative;
  }
  .statusbar{
    height:32px; flex:none; display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums;
  }
  .appbar{
    flex:none; height:50px; border-bottom:1px solid var(--line); background:var(--bar);
    display:flex; align-items:center; gap:8px; padding:0 12px;
  }
  .appbar .title{font-size:17px;font-weight:600;letter-spacing:-.01em;flex:1;min-width:0;
                 overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .back{background:none;border:none;padding:4px 8px;margin-left:-8px;color:var(--dim);
        font-size:22px;line-height:1;cursor:pointer;}
  .back:hover{color:var(--ink);}
  .sback{background:none;border:none;padding:4px 8px;margin-left:-8px;
         color:var(--dim);font-size:22px;line-height:1;cursor:pointer;}
  .sback:hover{color:var(--ink);}
  .sback:focus-visible{outline:2px solid var(--instr);outline-offset:-2px;}
  .scroll{flex:1;overflow-y:auto;}

  .row{display:flex;gap:12px;align-items:center;padding:12px 14px;
       border:none;border-bottom:1px solid var(--line);background:none;width:100%;
       text-align:left;cursor:pointer;font-family:inherit;}
  .row:hover{background:#171C23;}
  .avatar{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;
          font-size:15px;font-weight:600;color:#08090C;}
  .rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .rt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .rn{font-size:15px;font-weight:600;letter-spacing:-.01em;}
  .rtime{font-size:12px;color:var(--faint);flex:none;font-variant-numeric:tabular-nums;}
  .rp{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--alert);flex:none;}

  .convo{display:flex;flex-direction:column;gap:3px;padding:14px 12px 20px;}
  .msg{max-width:76%;padding:8px 12px;border-radius:16px;font-size:15px;line-height:1.35;
       word-wrap:break-word;}
  .msg.them{background:var(--them);align-self:flex-start;border-bottom-left-radius:5px;}
  .msg.me{background:var(--me);color:#E8EBEF;align-self:flex-end;border-bottom-right-radius:5px;}
  .msg.run{border-radius:16px;}
  .msg.live{animation:pop .22s ease-out;}
  .who{display:block;font-size:11px;color:var(--faint);margin-bottom:2px;}
  .divider{align-self:center;font-size:11px;color:var(--faint);padding:16px 0 10px;letter-spacing:.04em;}
  .stamp{align-self:center;font-size:11px;color:var(--faint);padding:6px 0 2px;}
  .photo{align-self:flex-start;max-width:76%;border-radius:14px;overflow:hidden;
         border-bottom-left-radius:5px;line-height:0;animation:pop .22s ease-out;}
  .photo canvas{width:100%;display:block;}
  .typing{align-self:flex-start;background:var(--them);border-radius:16px;
          border-bottom-left-radius:5px;padding:11px 14px;display:flex;gap:4px;}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1.3s infinite;}
  .typing i:nth-child(2){animation-delay:.2s;} .typing i:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,60%,100%{opacity:.3;}30%{opacity:1;}}
  @keyframes pop{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.typing i{animation:none;opacity:.55;}.msg.live,.photo{animation:none;}}

  .choices{flex:none;border-top:1px solid var(--line);background:var(--bar);
           padding:10px 12px;display:flex;flex-direction:column;gap:7px;}
  .choice{width:100%;padding:11px 14px;border:1px solid #2A323D;border-radius:20px;
          background:transparent;color:var(--ink);font-family:inherit;font-size:14px;
          text-align:left;cursor:pointer;transition:background .15s,border-color .15s;}
  .choice:hover{background:#1E232B;border-color:#3A434F;}
  .choice:focus-visible{outline:2px solid var(--instr);outline-offset:2px;}

  .end{position:absolute;inset:0;background:#08090C;display:flex;flex-direction:column;
       align-items:center;justify-content:center;gap:18px;padding:32px;text-align:center;
       opacity:0;pointer-events:none;transition:opacity 1.6s ease;}
  .end.on{opacity:1;pointer-events:auto;}
  .end p{font-family:"IBM Plex Mono",monospace;font-size:13px;line-height:1.7;color:var(--dim);
         margin:0;max-width:30ch;white-space:pre-line;}
  .end .t{color:var(--instr);letter-spacing:.18em;text-transform:uppercase;font-size:11px;}
  .end button{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;
              color:var(--faint);background:none;border:1px solid var(--line);
              border-radius:6px;padding:8px 14px;cursor:pointer;}
  .end button:hover{color:var(--ink);}


  /* ---- refinements ------------------------------------------------------- */
  :root{ --text:15px; --radius:16px; }
  .msg{font-size:var(--text);}
  .rp,.rn{transition:color .15s;}
  .row:focus-visible,.choice:focus-visible,.back:focus-visible,.cog:focus-visible{
    outline:2px solid var(--instr); outline-offset:-2px;}
  .row.pulse{animation:pulse .9s ease-out;}
  @keyframes pulse{0%{background:#20262F;}100%{background:none;}}
  .scroll::-webkit-scrollbar{width:6px;}
  .scroll::-webkit-scrollbar-thumb{background:#242B35;border-radius:3px;}
  .scroll::-webkit-scrollbar-track{background:transparent;}
  body.reduce .msg.live,body.reduce .photo,body.reduce .row.pulse{animation:none;}
  body.reduce .typing i{animation:none;opacity:.55;}
  body.notimestamps .stamp{display:none;}

  .cog{background:none;border:none;color:var(--dim);font-size:19px;line-height:1;
       padding:4px 6px;margin-right:-4px;cursor:pointer;}
  .cog:hover{color:var(--ink);}

  /* ---- the settings sheet ------------------------------------------------- */
  .sheet{position:absolute;inset:0;background:var(--phone);display:flex;
         flex-direction:column;transform:translateY(100%);transition:transform .28s
         cubic-bezier(.4,0,.2,1);z-index:5;}
  .sheet.on{transform:none;}
  body.reduce .sheet{transition:none;}
  .sheet .scroll{padding-bottom:24px;}
  .sgroup{padding:18px 16px 6px;font-size:11px;letter-spacing:.09em;color:var(--faint);
          text-transform:uppercase;}
  .srow{display:flex;align-items:center;gap:12px;padding:12px 16px;
        border-bottom:1px solid var(--line);font-size:14px;min-height:48px;}
  .srow .lbl{flex:1;min-width:0;}
  .srow .sub{display:block;font-size:11px;color:var(--faint);margin-top:2px;}
  .srow .val{color:var(--dim);font-variant-numeric:tabular-nums;font-size:13px;}
  button.srow{width:100%;background:none;border:none;border-bottom:1px solid var(--line);
              color:var(--ink);font-family:inherit;text-align:left;cursor:pointer;}
  button.srow:hover{background:#171C23;}
  .srow.danger .lbl{color:var(--alert);}

  .me-card{display:flex;gap:14px;align-items:center;padding:20px 16px;
           border-bottom:1px solid var(--line);}
  .me-card .avatar{width:52px;height:52px;font-size:19px;}
  .me-card .col{display:flex;flex-direction:column;min-width:0;flex:1;}
  .me-card .who2{font-size:17px;font-weight:600;}
  .me-card .sub{font-size:12px;color:var(--faint);margin-top:3px;}

  .toggle{width:42px;height:25px;border-radius:13px;background:#2A323D;border:none;
          position:relative;cursor:pointer;flex:none;transition:background .18s;}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;
                 border-radius:50%;background:#6D7784;transition:transform .18s,background .18s;}
  .toggle[aria-checked="true"]{background:#3E5B45;}
  .toggle[aria-checked="true"]::after{transform:translateX(17px);background:#CFE0D3;}
  body.reduce .toggle,body.reduce .toggle::after{transition:none;}

  .seg{display:flex;gap:4px;flex:none;}
  .seg button{background:#1B2029;border:1px solid #262E39;color:var(--dim);
              font-family:inherit;font-size:12px;padding:5px 11px;border-radius:7px;
              cursor:pointer;}
  .seg button[aria-pressed="true"]{background:#2E3A45;color:var(--ink);border-color:#3A4551;}

  .note{padding:14px 16px 4px;font-size:11px;line-height:1.55;color:var(--faint);}
  .fail{padding:10px 16px;font-size:12px;color:var(--alert);}

  .foot{font-family:"IBM Plex Mono",monospace;font-size:10px;color:#2E353F;letter-spacing:.1em;}
</style>

<div class="phone">
  <div class="statusbar"><span id="clock"></span><span>▮▮▮ ⌁</span></div>
  <div class="appbar" id="appbar"></div>
  <div class="scroll" id="scroll"></div>
  <div id="choices"></div>
  <div class="sheet" id="sheet" aria-hidden="true">
    <div class="appbar">
      <button class="sback" id="sheetBack" aria-label="Back">‹</button>
      <span class="title" id="sheetTitle"></span>
    </div>
    <div class="scroll" id="sheetBody"></div>
  </div>
  <div class="end" id="end">
    <p class="t" id="endTitle"></p>
    <p id="endBody"></p>
    <button id="again">Start again</button>
  </div>
</div>
<p class="foot">A WORK OF FICTION</p>

<script>
(function(){
"use strict";

/* ============================================================================
   D19 — SINGLE INGRESS
   Exactly one function puts story text on screen. It accepts only tokens minted
   by the Story or Director modules, and it stamps what it touched. Anything that
   reaches a bubble by another route has no stamp, and auditIngress() finds it.
   ========================================================================== */
var Text = (function(){
  var MINT = {};                       /* private brand; unreachable from outside */
  function mint(origin, value){
    return { __brand: MINT, origin: origin, value: value == null ? "" : String(value) };
  }
  function isToken(t){ return !!t && t.__brand === MINT; }
  function paint(el, token){
    if(!isToken(token)){
      /* not-story: developer-facing */
      throw new Error("story text must be a minted token (D19)");
    }
    el.textContent = token.value;
    el.setAttribute("data-src", token.origin);
    return el;
  }
  return { mint: mint, isToken: isToken, paint: paint };
})();

/* ============================================================================
   STORY LAYER — knows the schema, touches no DOM (D18)
   ========================================================================== */
var Story = (function(data){
  var beatsById = {}, contactsById = {}, threadsById = {};
  (data.beats || []).forEach(function(b){ beatsById[b.id] = b; });
  (data.contacts || []).forEach(function(c){ contactsById[c.id] = c; });
  (data.threads || []).forEach(function(t){ threadsById[t.id] = t; });

  return {
    raw: data,
    threads: function(){ return data.threads || []; },
    thread: function(id){ return threadsById[id]; },
    beat: function(id){ return beatsById[id]; },
    contact: function(id){ return contactsById[id]; },
    contactName: function(id){
      var c = contactsById[id];
      return c ? Text.mint("story.contact", c.displayName) : null;
    },
    threadName: function(t){ return Text.mint("story.thread", t.displayName); },
    bodyOf: function(m){ return Text.mint("story.message", m.body || ""); },
    labelOf: function(c){ return Text.mint("story.choice", c.label); },
    endingTitle: function(e){ return Text.mint("story.ending", e.title); },
    endingBody: function(e){ return Text.mint("story.ending", e.body); },
    endingFor: function(flags){
      var list = data.endings || [], found = null;
      list.forEach(function(e){
        if(found) return;
        var need = e.requiresFlags || [];
        if(!need.length) return;
        for(var i=0;i<need.length;i++){ if(!flags[need[i]]) return; }
        found = e;
      });
      return found;
    },
    messagesOf: function(beatId, flags){
      var b = beatsById[beatId];
      if(!b) return [];
      return (b.messages || []).filter(function(m){
        var need = m.requiresFlags || [];
        for(var i=0;i<need.length;i++){ if(!flags[need[i]]) return false; }
        return true;
      });
    },
    choicesOf: function(beatId){
      var b = beatsById[beatId];
      return (b && b.choices) || [];
    },
    nextOf: function(beatId){
      var b = beatsById[beatId];
      return b && b.next;
    },
    speakerOf: function(m){
      return m.fromContactId ? this.contactName(m.fromContactId) : null;
    }
  };
})(window.STORY);

/* Director output is story-derived too, so it mints through the same door. */
var Generated = {
  body: function(event){ return Text.mint("director.message", event.body); },
  label: function(event){ return Text.mint("director.choice", event.label); },
  speaker: function(event){
    var cast = (window.CONTENT && window.CONTENT.cast && window.CONTENT.cast.cast) || [];
    var found = null;
    cast.forEach(function(c){ if(c.id === event.speaker) found = c; });
    return found ? Text.mint("director.contact", found.displayName) : null;
  }
};

/* ============================================================================
   CLOCK
   ========================================================================== */
var LAUNCH = new Date();
var WEEKDAY = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var WEEKDAY_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function at(offsetMin){ return new Date(LAUNCH.getTime() + offsetMin*60000); }
function dayKey(d){ return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate(); }
function hhmm(d){ var h=d.getHours(), m=d.getMinutes(); return h+":"+(m<10?"0"+m:m); }
function daysBack(d){
  return Math.round((new Date(dayKey(LAUNCH)) - new Date(dayKey(d)))/86400000);
}
function dayLabel(d){
  var n = daysBack(d);
  if(n===0) return "Today";
  if(n===1) return "Yesterday";
  if(n<7) return WEEKDAY[d.getDay()];
  return d.getDate()+"/"+(d.getMonth()+1);
}
function listStamp(offsetMin){
  var d = at(offsetMin), n = daysBack(d);
  if(n===0) return hhmm(d);
  if(n===1) return "Yesterday";
  if(n<7) return WEEKDAY_SHORT[d.getDay()];
  return d.getDate()+"/"+(d.getMonth()+1);
}
function stampLabel(offsetMin){
  return offsetMin === 0 ? "now" : hhmm(at(offsetMin));
}

/* ============================================================================
   D24 — PERSISTENCE AND ELAPSED TIME
   ========================================================================== */
var STORAGE_KEY = "unread.save.v1";
var MINUTE = 60000, HOUR = 60*MINUTE;
var BANDS = {
  RESUME:   2*MINUTE,      /* < 2m  : nothing changed          */
  ADVANCED: HOUR,          /* < 1h  : messages already waiting */
  MISSED:   12*HOUR        /* < 12h : phase closed, no replies */
};

function randomSeed(){
  try {
    var buf = new Uint32Array(2);
    (window.crypto || window.msCrypto).getRandomValues(buf);
    return buf[0].toString(36) + buf[1].toString(36);
  } catch(e){
    return String(new Date().getTime());
  }
}

var Save = {
  read: function(){
    try { return JSON.parse(window.localStorage.getItem(STORAGE_KEY) || "null"); }
    catch(e){ return null; }
  },
  write: function(state){
    try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ /* private mode: the run simply does not persist */ }
  },
  clear: function(){
    try { window.localStorage.removeItem(STORAGE_KEY); } catch(e){}
  },
  fresh: function(now){
    return {
      runSeed: randomSeed(),
      day: 1,
      phase: "day",
      phaseStartedAt: now,
      lastSeenAt: now,
      flags: {},
      contactState: {},
      cluesFound: {}
    };
  }
};

/* The whole of D24 in one pure function, so the gate can assert it without a browser
   clock: given a save and a wall-clock now, what changed while you were gone? */
function applyAway(save, now){
  var awayMs = Math.max(0, now - (save.lastSeenAt || now));
  var result = { awayMs: awayMs, band: "resume", daysAdvanced: 0,
                 waiting: 0, repliesLocked: false };

  if(awayMs < BANDS.RESUME){
    result.band = "resume";
  } else if(awayMs < BANDS.ADVANCED){
    result.band = "advanced";
    /* 1-3 messages arrived while you were gone, scaled by how long that was */
    result.waiting = Math.min(3, 1 + Math.floor(awayMs / (20*MINUTE)));
  } else if(awayMs < BANDS.MISSED){
    result.band = "missed";
    result.repliesLocked = true;
  } else {
    result.band = "dayAdvanced";
    result.daysAdvanced = Math.min(3, Math.floor(awayMs / (12*HOUR)));
    result.repliesLocked = true;
  }
  return result;
}

/* ============================================================================
   RUNTIME STATE
   ========================================================================== */
var PHOTO_REVEAL_MS = 600;
var INTER_BEAT_MS   = 6000;
var PHOTO_ARRIVE_MS = 5000;
var THREADS_TO_READ = 3;
var UNKNOWN = "t_unknown";
var APP_NAME = "Loop";   /* the fictional messenger. Guideline 4.1: not anyone else's. */

var params = new URLSearchParams(window.location.search);
var FAST = params.has("fast");
var CONTENT = window.CONTENT || {};
var LADDER = CONTENT.ladder || { days: [], phaseWindowMs: 600000, fastWindowMs: 30000 };
var PHASE_WINDOW_MS = FAST ? (LADDER.fastWindowMs || 30000) : (LADDER.phaseWindowMs || 600000);

var S = {
  beat: 1,
  opened: {},
  flags: {},
  hidden: {},
  current: null,
  ended: false,
  leftDuringLive: false,
  shown: {},
  save: null,
  away: null,
  repliesLocked: false,
  pendingChoices: []
};

var scroll  = document.getElementById("scroll"),
    appbar  = document.getElementById("appbar"),
    choicesEl = document.getElementById("choices"),
    endEl   = document.getElementById("end");

document.getElementById("clock").textContent = hhmm(LAUNCH);

function resetThreads(){
  S.shown = {};
  Story.threads().forEach(function(t){
    S.shown[t.id] = Story.messagesOf(t.startBeat, S.flags).slice();
  });
}
resetThreads();

function shownOf(t){ return S.shown[t.id] || []; }
function lastOffset(t){
  var m = shownOf(t);
  return m.length ? m[m.length-1].offsetMinutes : -999999;
}
function isUnread(t){ return (t.startsUnread || t.forcedUnread) && !S.opened[t.id]; }
function sortedThreads(){
  return Story.threads()
    .filter(function(t){ return !S.hidden[t.id]; })
    .slice()
    .sort(function(a,b){ return lastOffset(b)-lastOffset(a); });
}

/* ============================================================================
   THE HALLWAY, DRAWN NOT FETCHED
   ========================================================================== */
function hallway(){
  var W=260,H=190,c=document.createElement("canvas");
  c.width=W; c.height=H;
  var g=c.getContext("2d");
  g.fillStyle="#0a0a0b"; g.fillRect(0,0,W,H);
  var vx=W*0.54, vy=H*0.48;
  g.fillStyle="#111214";
  g.beginPath(); g.moveTo(0,0); g.lineTo(vx-46,vy-30); g.lineTo(vx-46,vy+34); g.lineTo(0,H); g.fill();
  g.fillStyle="#0e0f11";
  g.beginPath(); g.moveTo(W,0); g.lineTo(vx+52,vy-30); g.lineTo(vx+52,vy+34); g.lineTo(W,H); g.fill();
  g.fillStyle="#141517";
  g.beginPath(); g.moveTo(0,H); g.lineTo(vx-46,vy+34); g.lineTo(vx+52,vy+34); g.lineTo(W,H); g.fill();
  var grd=g.createLinearGradient(vx-46,vy-30,vx+52,vy+34);
  grd.addColorStop(0,"#2b2721"); grd.addColorStop(.55,"#4a4034"); grd.addColorStop(1,"#211e1a");
  g.fillStyle=grd; g.fillRect(vx-46,vy-30,98,64);
  var sp=g.createLinearGradient(vx,vy+34,vx,H);
  sp.addColorStop(0,"rgba(120,102,74,0.22)"); sp.addColorStop(1,"rgba(120,102,74,0)");
  g.fillStyle=sp;
  g.beginPath(); g.moveTo(vx-46,vy+34); g.lineTo(vx+52,vy+34); g.lineTo(W*0.86,H); g.lineTo(W*0.16,H); g.fill();
  var vg=g.createRadialGradient(W/2,H/2,H*0.22,W/2,H/2,H*0.95);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,0.82)");
  g.fillStyle=vg; g.fillRect(0,0,W,H);
  var img=g.getImageData(0,0,W,H), d=img.data;
  for(var i=0;i<d.length;i+=4){
    var n=(Math.random()-0.5)*34;
    d[i]  =Math.max(0,Math.min(255,d[i]+n));
    d[i+1]=Math.max(0,Math.min(255,d[i+1]+n));
    d[i+2]=Math.max(0,Math.min(255,d[i+2]+n*0.9));
  }
  g.putImageData(img,0,0);
  return c;
}

/* ============================================================================
   RENDER LAYER
   ========================================================================== */
function previewToken(t){
  var m = shownOf(t);
  if(!m.length) return Text.mint("story.preview", "");
  var last = m[m.length-1];
  if(last.kind === "photo") return Text.mint("ui.chrome", "Photo");
  /* Only a group chat names its speaker. In a one-to-one thread the name is already
     the thread title, and "Mom: ren" reads like a bug. */
  var group = (t.participantIds || []).length > 1;
  var who = (group && last.fromContactId) ? Story.contact(last.fromContactId) : null;
  var prefix = who ? who.displayName + ": " : "";
  return Text.mint("story.preview", prefix + (last.body || ""));
}

function renderList(){
  S.current=null; choicesEl.innerHTML="";
  appbar.innerHTML='<span class="title"></span><button class="cog" id="cog" aria-label="Settings">⚙</button>';
  Text.paint(appbar.querySelector(".title"), Text.mint("ui.chrome", APP_NAME));
  appbar.querySelector("#cog").addEventListener("click", openSettings);
  scroll.innerHTML="";
  sortedThreads().forEach(function(t){
    var b=document.createElement("button");
    b.className="row";
    b.setAttribute("data-thread", t.id);
    b.innerHTML='<span class="avatar"></span><span class="rb"><span class="rt">'+
      '<span class="rn"></span><span class="rtime"></span></span><span class="rp"></span></span>';
    var av=b.querySelector(".avatar");
    av.style.background = t.accentHex || "#6E7480";
    av.textContent = (t.displayName || "").charAt(0).toUpperCase();
    Text.paint(b.querySelector(".rn"), Story.threadName(t));
    b.querySelector(".rtime").textContent = listStamp(lastOffset(t));
    Text.paint(b.querySelector(".rp"), previewToken(t));
    if(isUnread(t)){
      var d=document.createElement("span"); d.className="dot"; b.appendChild(d);
      if(prefs.alerts) b.classList.add("pulse");
    }
    b.addEventListener("click", function(){ openThread(t); });
    scroll.appendChild(b);
  });
  scroll.scrollTop=0;
  maybeAdvance();
}

function bubbleFor(m, prev){
  if(m.kind === "photo"){
    var p=document.createElement("div"); p.className="photo";
    p.setAttribute("data-src","story.photo");
    p.appendChild(hallway());
    return p;
  }
  var prevWho = prev && prev.fromContactId, thisWho = m.fromContactId;
  var same = prev && prev.from === m.from && prevWho === thisWho;
  var el=document.createElement("div");
  el.className = "msg " + (m.from === "me" ? "me" : "them") + (same ? " run" : "");
  var thread = m.__threadId ? Story.thread(m.__threadId) : S.current;
  var isGroup = !!(thread && (thread.participantIds || []).length > 1);
  var whoToken = (isGroup && m.fromContactId) ? Story.contactName(m.fromContactId) : null;
  if(whoToken && !same){
    var w=document.createElement("span"); w.className="who";
    Text.paint(w, whoToken);
    el.appendChild(w);
  }
  var body=document.createElement("span");
  body.className="body";
  Text.paint(body, m.__token || Story.bodyOf(m));
  el.appendChild(body);
  el.setAttribute("data-src", body.getAttribute("data-src"));
  return el;
}

function appendStamp(wrap, m){
  if(!m.showTimestamp) return;
  var s=document.createElement("div"); s.className="stamp";
  s.textContent = stampLabel(m.offsetMinutes);
  wrap.appendChild(s);
}

function paint(t){
  var wrap=document.createElement("div"); wrap.className="convo";
  var lastDay=null, prev=null;
  shownOf(t).forEach(function(m){
    var d=at(m.offsetMinutes);
    /* D5: a divider needs a calendar-day change AND a gap of at least 30 minutes. */
    var gapOK = !prev || (m.offsetMinutes - prev.offsetMinutes) >= 30;
    if(dayKey(d)!==lastDay && (lastDay===null || gapOK)){
      var div=document.createElement("div"); div.className="divider";
      div.textContent=dayLabel(d); wrap.appendChild(div);
      lastDay=dayKey(d); prev=null;
    }
    wrap.appendChild(bubbleFor(m, prev));
    appendStamp(wrap, m);
    prev=m;
  });
  scroll.innerHTML=""; scroll.appendChild(wrap);
  return wrap;
}

function openThread(t){
  S.current=t; S.opened[t.id]=true; t.forcedUnread=false;
  choicesEl.innerHTML="";
  appbar.innerHTML='<button class="back" aria-label="Back">‹</button><span class="title"></span>';
  Text.paint(appbar.querySelector(".title"), Story.threadName(t));
  appbar.querySelector(".back").addEventListener("click", function(){
    if(!S.ended) renderList();
  });
  paint(t);
  scroll.scrollTop=0;
  var mine = choicesForThread(t.id);
  if(mine.length && !S.repliesLocked) renderChoices(mine);
  if(t.id === UNKNOWN) runQueue();
  else maybeAdvance();
}

/* ============================================================================
   LIVE DELIVERY
   ========================================================================== */
function deliver(threadId, list, done){
  var t = Story.thread(threadId);
  var wrap = scroll.querySelector(".convo");
  if(!wrap){ if(done) done(); return; }
  var i=0;
  (function step(){
    if(i>=list.length){ if(done) done(); return; }
    var m=list[i++];
    setTimeout(function(){
      var showTyping = m.kind !== "photo" && m.from !== "me";
      var ty=null;
      if(showTyping){
        ty=document.createElement("div"); ty.className="typing";
        ty.innerHTML="<i></i><i></i><i></i>";
        wrap.appendChild(ty); scroll.scrollTop=scroll.scrollHeight;
      }
      setTimeout(function(){
        if(ty) ty.remove();
        var prev = shownOf(t)[shownOf(t).length-1];
        S.shown[t.id].push(m);
        var el=bubbleFor(m, prev); el.classList.add("live");
        if(prefs.vibrate && navigator.vibrate) navigator.vibrate(14);
        wrap.appendChild(el);
        appendStamp(wrap, m);
        scroll.scrollTop=scroll.scrollHeight;
        step();
      }, showTyping ? (m.typingMs || 0) : PHOTO_REVEAL_MS);
    }, m.delayMs || 0);
  })();
}

/* ============================================================================
   BEATS (day 1 night)
   ========================================================================== */
function maybeAdvance(){
  var read=Object.keys(S.opened).length;
  if(S.beat===1 && read>=THREADS_TO_READ && !S.current){
    S.beat=2;
    setTimeout(function(){
      var t=Story.thread(UNKNOWN);
      var photo=Story.messagesOf("b_unknown_2", S.flags);
      S.shown[UNKNOWN]=S.shown[UNKNOWN].concat(photo);
      t.forcedUnread=true; S.opened[UNKNOWN]=false;
      if(!S.current) renderList();
    }, PHOTO_ARRIVE_MS);
  }
}

function runQueue(){
  if(S.beat===2){
    S.beat=3;
    deliver(UNKNOWN, Story.messagesOf("b_unknown_3", S.flags), function(){
      S.beat=4;
      setTimeout(beat4, INTER_BEAT_MS);
    });
  } else if(S.beat===4){
    beat4();
  }
}

function beat4(){
  var t=Story.thread(UNKNOWN);
  if(S.current !== t){ t.forcedUnread=true; S.opened[UNKNOWN]=false; renderList(); return; }
  if(S.leftDuringLive) S.flags["left_during_live"]=true;
  deliver(UNKNOWN, Story.messagesOf("b_unknown_4", S.flags), function(){
    S.beat=5;
    renderChoices(Story.choicesOf("b_unknown_4").map(function(c){
      return { id: c.id, token: Story.labelOf(c), choice: c };
    }));
  });
}


/* A reply belongs to the question it answers, not merely to the thread. If Mom asked
   about the weekend and then about the car, answering one must not discard the other --
   but four buttons at once is a wall, so a conversation offers one question's answers at
   a time, in the order they were asked. Answer the weekend and the car is still there. */
function pendingInThread(threadId){
  return S.pendingChoices.filter(function(c){ return c.threadId === threadId; });
}

function choicesForThread(threadId){
  var all = pendingInThread(threadId);
  if(!all.length) return [];
  var oldest = all[0].templateId;
  return all.filter(function(c){ return c.templateId === oldest; });
}

/* The player's reply lands in the thread as a message. Without this the choice vanishes
   and the conversation does not change, which reads as a broken button. */
function answerInThread(item){
  var t = Story.thread(item.threadId);
  if(t && S.shown[t.id]){
    S.shown[t.id].push({
      id: "reply_" + item.id + "_" + S.shown[t.id].length,
      from: "me",
      kind: "text",
      body: item.label,
      offsetMinutes: 0,
      live: false,
      delayMs: 0,
      typingMs: 0,
      __threadId: item.threadId,
      __token: item.token
    });
  }
  /* only this question's replies are spent; anything else the thread asked survives */
  S.pendingChoices = S.pendingChoices.filter(function(c){
    return !(c.threadId === item.threadId && c.templateId === item.templateId);
  });
  if(item.onPick) item.onPick(item);

  if(S.current && t && S.current.id === t.id){
    paint(t);
    scroll.scrollTop = scroll.scrollHeight;
    renderChoices(choicesForThread(t.id));
  }
}

/* One place choices are built, for the same reason as one place text is painted. */
function renderChoices(items){
  choicesEl.innerHTML="";
  if(S.repliesLocked) return;
  items.forEach(function(item){
    var b=document.createElement("button");
    b.className="choice";
    b.setAttribute("data-choice", item.id);
    Text.paint(b, item.token);
    b.addEventListener("click", function(){
      if(item.choice){
        choicesEl.innerHTML="";
        S.pendingChoices=[];
        finish(item.choice);
      } else {
        answerInThread(item);
      }
    });
    choicesEl.appendChild(b);
  });
}

/* ============================================================================
   D20 — ENDINGS DECLARE A MECHANIC
   ========================================================================== */
var MECHANIC_TIMING = {
  linear:   { reveal: 3600 },
  hold:     { typingAfter: 4000, reveal: 26000 },
  reappear: { removeAfter: 700, returnAfter: 7000, reveal: 12500 }
};

var FINAL_DAY = 100;

/* Day 1's answer used to end the run, which made days 2-100 unreachable in play. It now
   sets the flag and the game carries on: the ending it chose arrives on day 100, ninety
   nine days later. */
function finish(choice){
  (choice.setsFlags || []).forEach(function(f){ S.flags[f]=true; });
  S.save.flags = S.flags;
  Save.write(S.save);
  if((S.save.day || 1) < FINAL_DAY) return;
  S.ended=true;
  var ending=Story.endingFor(S.flags);
  if(!ending) return;
  var mechanic = ending.mechanic || "linear";
  var timing = MECHANIC_TIMING[mechanic] || MECHANIC_TIMING.linear;
  var messages=Story.messagesOf(ending.beatId, S.flags);

  if(mechanic === "reappear"){
    setTimeout(function(){ S.hidden[UNKNOWN]=true; renderList(); }, timing.removeAfter);
    setTimeout(function(){
      S.hidden[UNKNOWN]=false;
      S.shown[UNKNOWN]=messages.slice();
      Story.thread(UNKNOWN).forcedUnread=true; S.opened[UNKNOWN]=false;
      renderList();
    }, timing.returnAfter);
    setTimeout(function(){ reveal(ending); }, timing.reveal);
    return;
  }

  if(mechanic === "hold"){
    var wrap=scroll.querySelector(".convo");
    setTimeout(function(){
      if(!wrap) return;
      var ty=document.createElement("div"); ty.className="typing";
      ty.innerHTML="<i></i><i></i><i></i>";
      wrap.appendChild(ty); scroll.scrollTop=scroll.scrollHeight;
    }, timing.typingAfter);
    setTimeout(function(){ reveal(ending); }, timing.reveal);
    return;
  }

  var immediate=messages.filter(function(m){ return m.from==="me"; });
  var rest=messages.filter(function(m){ return m.from!=="me"; });
  var wrap2=scroll.querySelector(".convo");
  immediate.forEach(function(m){
    var prev=shownOf(Story.thread(UNKNOWN)).slice(-1)[0];
    S.shown[UNKNOWN].push(m);
    if(wrap2){ wrap2.appendChild(bubbleFor(m, prev)); appendStamp(wrap2, m); }
  });
  if(wrap2) scroll.scrollTop=scroll.scrollHeight;
  deliver(UNKNOWN, rest, function(){
    setTimeout(function(){ reveal(ending); }, timing.reveal);
  });
}

function reveal(ending){
  Text.paint(document.getElementById("endTitle"), Story.endingTitle(ending));
  Text.paint(document.getElementById("endBody"), Story.endingBody(ending));
  endEl.classList.add("on");
}

document.getElementById("again").addEventListener("click", function(){
  Save.clear(); window.location.reload();
});

/* ============================================================================
   THE DAY RUNNER — generated days 2..N
   ========================================================================== */
function planFor(day){
  if(!window.Director || !CONTENT.templates) return null;
  var carried = {
    flags: S.flags,
    fired: (S.save && S.save.fired) || {},
    memory: (S.save && S.save.contactState && S.save.contactState.memory) || {},
    clues: (S.save && S.save.cluesFound) || {}
  };
  return window.Director.planDay(
    { cast: CONTENT.cast, templates: CONTENT.templates, ladder: CONTENT.ladder,
      story: Story.raw },
    (S.save && S.save.runSeed) || "default", day, carried);
}

/* Turn generated events into messages the renderer already understands. Offsets are
   spread across the phase window so the thread list stamps them plausibly. */
function eventsToMessages(events, baseOffsetMin){
  var out = [], n = 0;
  events.forEach(function(e){
    if(e.kind === "choice") return;
    out.push({
      id: "g_" + (baseOffsetMin) + "_" + (n),
      from: "them",
      kind: "text",
      fromContactId: e.speaker,
      __threadId: e.threadId,
      body: e.body,
      offsetMinutes: baseOffsetMin + n,
      live: false,
      delayMs: 0,
      typingMs: 0,
      __token: Text.mint("director.message", e.body)
    });
    n += 1;
  });
  return out;
}

function loadPhase(day, phase, options){
  options = options || {};
  var plan = planFor(day);
  if(!plan) return null;
  S.save.day = day; S.save.phase = phase;
  var events = plan.phases[phase] || [];

  if(!plan.authored){
    resetThreads();
    var byThread = {};
    events.forEach(function(e){
      if(e.kind === "choice") return;
      (byThread[e.threadId] = byThread[e.threadId] || []).push(e);
    });
    Object.keys(byThread).forEach(function(threadId){
      if(!S.shown[threadId]) return;
      var base = -(60 - Math.min(50, byThread[threadId].length));
      S.shown[threadId] = S.shown[threadId].concat(
        eventsToMessages(byThread[threadId], base));
      var t = Story.thread(threadId);
      if(t) { t.forcedUnread = true; S.opened[threadId] = false; }
    });
    S.pendingChoices = events
      .filter(function(e){ return e.kind === "choice"; })
      .map(function(e){
        return { id: e.choiceId, threadId: e.threadId, templateId: e.templateId,
                 label: e.label,
                 token: Generated.label(e), tells: e.tells,
                 revealsClue: e.revealsClue, memory: e.memory,
                 onPick: function(item){
                   recordTold(item.tells);
                   recordClue(item.revealsClue);
                   recordMemory(item.memory);
                 } };
      });
  }
  Save.write(S.save);
  if(!options.silent) renderList();
  if(day >= FINAL_DAY && phase === "night") revealFinalEnding();
  return plan;
}

/* One hundred days later. Whatever was said on night one is what it says back. */
function revealFinalEnding(){
  if(S.ended) return;
  var ending = Story.endingFor(S.flags) || Story.endingFor({ unanswered: true });
  if(!ending) return;
  S.ended = true;
  reveal(ending);
}

/* Act I only writes lastToldByRen. Act II reads it. Retrofitting memory onto twenty days
   of already-played history is not possible, so it is written from day one. */
function recordTold(tells){
  if(!tells) return;
  var state = S.save.contactState || (S.save.contactState = {});
  var told = state.lastToldByRen || (state.lastToldByRen = []);
  told.push({ day: S.save.day, phase: S.save.phase, said: tells });
  Save.write(S.save);
}

/* D27: a reply that reveals something writes the clue id. Act I only accumulates; nothing
   reads these until Act II. */
function recordClue(clueId){
  if(!clueId) return;
  var found = S.save.cluesFound || (S.save.cluesFound = {});
  found[clueId] = { day: S.save.day, phase: S.save.phase };
  Save.write(S.save);
}

/* Act II quotes this back. Written the first time only: the earliest thing the player
   said is the one that has had longest to be wrong. */
function recordMemory(memory){
  if(!memory || !memory.tag) return;
  var state = S.save.contactState || (S.save.contactState = {});
  var bank = state.memory || (state.memory = {});
  if(bank[memory.tag]) return;
  bank[memory.tag] = memory.fragment;
  Save.write(S.save);
}

   Diegetic on purpose. The founding rule is no title screen and no menu; a
   messenger having a settings page is not a menu, it is the app being an app.

};

var PREF_KEY = "unread.prefs.v1";
var Prefs = {
  defaults: { alerts: true, vibrate: false, text: "M", motion: false, stamps: true,
              blocked: [] },
  read: function(){
    var stored = {};
    try { stored = JSON.parse(window.localStorage.getItem(PREF_KEY) || "{}") || {}; }
    catch(e){ stored = {}; }
    var out = {};
    Object.keys(this.defaults).forEach(function(k){
      out[k] = stored[k] === undefined ? Prefs.defaults[k] : stored[k];
    });
    return out;
  },
  write: function(p){
    try { window.localStorage.setItem(PREF_KEY, JSON.stringify(p)); } catch(e){}
  }
};

var TEXT_PX = { S: "13px", M: "15px", L: "17px" };
var prefs = Prefs.read();

function applyPrefs(){
  document.documentElement.style.setProperty("--text", TEXT_PX[prefs.text] || TEXT_PX.M);
  document.body.classList.toggle("reduce", !!prefs.motion);
  document.body.classList.toggle("notimestamps", !prefs.stamps);
}

function savePrefs(){ Prefs.write(prefs); applyPrefs(); }

/* live values, read at the moment the sheet opens rather than cached */
function messageCount(){
  var n = 0;
  Object.keys(S.shown).forEach(function(id){ n += S.shown[id].length; });
  return n;
}
function storageBytes(){
  var total = 0;
  try {
    for(var i=0;i<window.localStorage.length;i++){
      var key = window.localStorage.key(i);
      total += key.length + (window.localStorage.getItem(key) || "").length;
    }
  } catch(e){}
  /* the fiction is a phone that has been carrying these threads for months */
  return total * 2 + messageCount() * 1400;
}
function humanBytes(n){
  if(n < 1024) return n + " B";
  if(n < 1048576) return (n/1024).toFixed(0) + " KB";
  return (n/1048576).toFixed(1) + " MB";
}

/* Ren's account, and the last time Ren used it. On day one that reads six days. On day
   one hundred it reads a hundred and five, while you are holding the phone. */
function renLastActive(){
  var newest = null;
  Story.threads().forEach(function(t){
    (S.shown[t.id] || []).forEach(function(m){
      if(m.from !== "me") return;
      if(newest === null || m.offsetMinutes > newest) newest = m.offsetMinutes;
    });
  });
  if(newest === null) return CHROME.now;
  var elapsed = Math.max(0, -newest) + ((S.save && S.save.day ? S.save.day - 1 : 0) * 1440);
  var days = Math.floor(elapsed / 1440);
  if(days < 1) return CHROME.now;
  return days + (days === 1 ? " day ago" : " days ago");   /* not-story */
}

/* ---- builders: every string goes through the one ingress (D19) ------------ */
function chrome(text){ return Text.mint("ui.chrome", text); }

function sGroup(label){
  var el = document.createElement("div");
  el.className = "sgroup";
  Text.paint(el, chrome(label));
  return el;
}

function sRow(label, sub){
  var row = document.createElement("div");
  row.className = "srow";
  var wrap = document.createElement("span");
  wrap.className = "lbl";
  var main = document.createElement("span");
  Text.paint(main, chrome(label));
  wrap.appendChild(main);
  if(sub){
    var s2 = document.createElement("span");
    s2.className = "sub";
    Text.paint(s2, chrome(sub));
    wrap.appendChild(s2);
  }
  row.appendChild(wrap);
  return row;
}

function sToggle(label, sub, key, onChange){
  var row = sRow(label, sub);
  var b = document.createElement("button");
  b.className = "toggle";
  b.setAttribute("role", "switch");
  b.setAttribute("data-pref", key);
  b.setAttribute("aria-checked", prefs[key] ? "true" : "false");
  b.setAttribute("aria-label", label);
  b.addEventListener("click", function(){
    prefs[key] = !prefs[key];
    b.setAttribute("aria-checked", prefs[key] ? "true" : "false");
    savePrefs();
    if(onChange) onChange(prefs[key]);
  });
  row.appendChild(b);
  return row;
}

function sValue(label, value){
  var row = sRow(label);
  var v = document.createElement("span");
  v.className = "val";
  Text.paint(v, chrome(value));
  row.appendChild(v);
  return row;
}

function sSegment(label, key, options){
  var row = sRow(label);
  var seg = document.createElement("div");
  seg.className = "seg";
  options.forEach(function(option){
    var b = document.createElement("button");
    b.setAttribute("data-size", option);
    b.setAttribute("aria-pressed", prefs[key] === option ? "true" : "false");
    Text.paint(b, chrome(CHROME[option === "S" ? "small" : option === "M" ? "medium" : "large"]));
    b.addEventListener("click", function(){
      prefs[key] = option;
      savePrefs();
      Array.prototype.forEach.call(seg.children, function(c){
        c.setAttribute("aria-pressed", c.getAttribute("data-size") === option ? "true" : "false");
      });
    });
    seg.appendChild(b);
  });
  row.appendChild(seg);
  return row;
}

function sButton(label, sub, onClick, danger){
  var row = document.createElement("button");
  row.className = "srow" + (danger ? " danger" : "");
  var wrap = document.createElement("span");
  wrap.className = "lbl";
  var main = document.createElement("span");
  Text.paint(main, chrome(label));
  wrap.appendChild(main);
  if(sub){
    var s2 = document.createElement("span");
    s2.className = "sub";
    Text.paint(s2, chrome(sub));
    wrap.appendChild(s2);
  }
  row.appendChild(wrap);
  row.addEventListener("click", onClick);
  return row;
}

function buildSettings(){
  var body = document.getElementById("sheetBody");
  body.innerHTML = "";

  var card = document.createElement("div");
  card.className = "me-card";
  var av = document.createElement("span");
  av.className = "avatar";
  av.style.background = "#7E8A93";
  av.textContent = "R";              /* not-story: the account initial */
  var col = document.createElement("span");
  col.className = "col";
  var name = document.createElement("span");
  name.className = "who2";
  Text.paint(name, chrome(CHROME.account));
  var sub = document.createElement("span");
  sub.className = "sub";
  Text.paint(sub, chrome(CHROME.lastActive + " " + renLastActive()));
  col.appendChild(name); col.appendChild(sub);
  card.appendChild(av); card.appendChild(col);
  body.appendChild(card);

  body.appendChild(sGroup(CHROME.notifications));
  body.appendChild(sToggle(CHROME.alerts, CHROME.alertsSub, "alerts"));
  body.appendChild(sToggle(CHROME.vibrate, CHROME.vibrateSub, "vibrate", function(on){
    if(on && navigator.vibrate) navigator.vibrate(18);
  }));

  body.appendChild(sGroup(CHROME.display));
  body.appendChild(sSegment(CHROME.textSize, "text", ["S", "M", "L"]));
  body.appendChild(sToggle(CHROME.reduceMotion, null, "motion"));
  body.appendChild(sToggle(CHROME.timestamps, null, "stamps"));

  body.appendChild(sGroup(CHROME.privacy));
  var blockedRow = sValue(CHROME.blocked,
    prefs.blocked.length ? String(prefs.blocked.length) : CHROME.blockedNone);
  body.appendChild(blockedRow);
  var fail = document.createElement("div");
  fail.className = "fail";
  fail.style.display = "none";
  body.appendChild(sButton(CHROME.blockThis, null, function(){
    /* It never works. The number is not in the phone's contact list, so there is nothing
       for the block to attach to -- which the app can only express as a failure. */
    Text.paint(fail, chrome(CHROME.blockFailed));
    fail.style.display = "";
  }));
  body.appendChild(fail);

  body.appendChild(sGroup(CHROME.storage));
  body.appendChild(sValue(CHROME.messages, String(messageCount())));
  body.appendChild(sValue(CHROME.onDevice, humanBytes(storageBytes())));

  body.appendChild(sGroup(CHROME.about));
  body.appendChild(sValue(CHROME.version, CHROME.versionNo));
  body.appendChild(sButton(CHROME.reset, CHROME.resetSub, function(){
    if(this.getAttribute("data-armed") === "1"){
      Save.clear();
      try { window.localStorage.removeItem(PREF_KEY); } catch(e){}
      window.location.reload();
      return;
    }
    this.setAttribute("data-armed", "1");
    Text.paint(this.querySelector(".lbl > span"), chrome(CHROME.resetConfirm));
  }, true));

  var note = document.createElement("div");
  note.className = "note";
  Text.paint(note, chrome(CHROME.fiction));
  body.appendChild(note);
}

function openSettings(){
  buildSettings();
  Text.paint(document.getElementById("sheetTitle"), chrome(CHROME.settings));
  var sheet = document.getElementById("sheet");
  sheet.classList.add("on");
  sheet.setAttribute("aria-hidden", "false");
}
function closeSettings(){
  var sheet = document.getElementById("sheet");
  sheet.classList.remove("on");
  sheet.setAttribute("aria-hidden", "true");
}
document.getElementById("sheetBack").addEventListener("click", closeSettings);
document.addEventListener("keydown", function(e){
  if(e.key === "Escape") closeSettings();
});
applyPrefs();

/* ============================================================================
   BOOT
   ========================================================================== */
function boot(){
  var now = new Date().getTime();
  var save = Save.read();
  if(!save){ save = Save.fresh(now); }
  S.save = save;
  S.flags = save.flags || {};

  S.away = applyAway(save, now);
  if(S.away.band === "missed" || S.away.band === "dayAdvanced"){
    S.repliesLocked = true;
    S.pendingChoices = [];
  }
  if(S.away.daysAdvanced > 0){
    save.day = Math.min(100, (save.day || 1) + S.away.daysAdvanced);
    save.phase = "day";
  }
  save.lastSeenAt = now;
  Save.write(save);

  if(save.day > 1) loadPhase(save.day, save.phase, { silent: true });
  renderList();
}

function touch(){
  if(!S.save) return;
  S.save.lastSeenAt = new Date().getTime();
  Save.write(S.save);
}
document.addEventListener("visibilitychange", function(){
  if(document.hidden && S.beat>=3 && !S.ended) S.leftDuringLive=true;
  touch();
});
window.addEventListener("pagehide", touch);
window.addEventListener("beforeunload", touch);

/* ============================================================================
   TEST HOOKS
   ========================================================================== */
window.__unread = {
  state: S,
  story: Story,
  save: Save,
  applyAway: applyAway,
  bands: BANDS,
  phaseWindowMs: PHASE_WINDOW_MS,
  openThread: openThread,
  renderList: renderList,
  loadPhase: function(day, phase){ return loadPhase(day, phase); },
  choicesForThread: function(id){ return choicesForThread(id).map(function(c){ return c.id; }); },
  finalDay: FINAL_DAY,
  openSettings: openSettings,
  closeSettings: closeSettings,
  prefs: function(){ return prefs; },
  memory: function(){ return (S.save.contactState && S.save.contactState.memory) || {}; },
  pendingInThread: function(id){
    return pendingInThread(id).map(function(c){ return { id: c.id, templateId: c.templateId }; });
  },
  pickChoice: function(id){
    var el = document.querySelector('[data-choice="' + id + '"]');
    if(el) el.click();
    return !!el;
  },
  /* D19: every element that shows story text carries the ingress stamp. Anything that
     reached the screen another way has none, and shows up here. */
  auditIngress: function(){
    var offenders = [];
    /* not-story: a CSS selector */
    var nodes = document.querySelectorAll(".msg, .choice, .rp, .rn, .photo");
    Array.prototype.forEach.call(nodes, function(el){
      if(!el.getAttribute("data-src")) offenders.push(el.className + ":" + el.textContent.slice(0,40));
    });
    return offenders;
  },
  paintUnminted: function(){
    /* the seeded negative: a second path into a bubble */
    var wrap = scroll.querySelector(".convo") || scroll;
    var rogue = document.createElement("div");
    rogue.className = "msg them";
    /* not-story: the seeded negative deliberately bypasses the ingress */
    rogue.textContent = "this did not come from story.json";
    wrap.appendChild(rogue);
    return rogue;
  },
  mintedPaintRejects: function(){
    var el = document.createElement("div");
    try { Text.paint(el, "a raw string"); return false; }
    catch(e){ return true; }
  }
};

boot();
})();
</script>
